<!--
Flappy Bird
-->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <link rel="shortcut icon" href="uccello.png" type="image/x-icon">
    <style>
        button{
            position: absolute;
            top: -10px;
            left: -10px;
            width: 310px;
            height: 560px;
            opacity: 0;
            z-index: 15;
        }
        span{
            position: absolute;
            background-color: white;
            width: 400px;
            height: 700px;
            opacity: 1;
            z-index: 10;
        }
        h3{
            position: absolute;
            background-color: aliceblue;
            border-color: black;
            border-style: groove;
            border-radius: 3px;
            padding: 10px;
            opacity: 1;
            z-index: 10;
            top:480px;
            left:30px;
        }
        h5{
            position: relative;
            background-color: transparent;
            padding: 10px;
            opacity: 1;
            z-index: 10;
            top:25%;
            left:25%;
        }
    </style>
</head>
<body>
    <!--<button style="z-index: 30;opacity: 0;height: 30px;width: 30px;top:580px;left:220px;" onclick="debugg()">ggg</button>-->
    <div id="uccello">
        <img style="position: absolute;
            top:100px;
            left:57px;
            " src="uccello.png" alt="Flappy Bird">    
    </div>
    <div id="sfondo">
        <img style="position: absolute;
            top:0px;
            left:0px;
            z-index:-1;
            " src="sfondo2.png" alt="Flappy Bird">  
        <img style="position: absolute;
            top:434px;
            left:0px;
            z-index:3;
            " src="prato.png" alt="Flappy Bird">
        <span style="top: 0px;
            left: 300px;"></span>
        <span style="top: 500px;
            left: 0px;"></span>
        <span style="top: 500px;border:0px;
            left: 0px;height: 70px;width: 300px;background-color: rgb(131,203 , 83);">
            <h5>©CofC-FM</h5>
        </span>
    </div>

    <div id="perso" style="position:absolute;
            top:0;
            left:0;
            opacity: 1;
            z-index:1;">
        <h1 style="position: relative;
            top:50%;
            left:50%;
            opacity: 0;
            z-index:1;">Hai Perso</h1>    
            <h1 style="position: relative;
            top:70%;
            left:50%;
            opacity: 0;
            z-index:1;">Icaro</h1>    
    </div>  
    <div id="tubo">

    </div>
    <button onclick="salta()"></button>
    <h3 id="punti"></h3>
    <h3 style="left: 170px;" id="max"></h3>
    
    <script>
        let debug=false;
        function debugg(){
            if (debug){
            debug=false
            }else{
                debug=true
            }
            console.log("altz:"+altz)
            console.log("altzt1:"+altzt1)
            console.log("altzt2:"+altzt2)
            console.log("spot1:"+spot1)
            console.log("spot2:"+spot2)
        }
        let op;
        let puntii=0;
        let per=false;
        const spo=57;
        let altz=100;
        let spot1=350;
        let spot2=spot1+225;
        let altzt1=100+Math.random() * 250;
        let altzt2=100+Math.random() * 250;
        let varvar;
        let punti=0;
        let nmax;
        if(!localStorage.getItem("max")){
            localStorage.setItem("max","")
        }
        let max = Number(localStorage.getItem("max"))
        function perso(vari,i){
            if(punti>max){
                nmax = punti.toString()
                localStorage.setItem("max",nmax)
                max = punti
            }
            if(i==1){
            document.getElementById("perso").innerHTML=`<h1 style="position: relative;
            top:50%;
            left:50%;
            opacity: ${vari};
            z-index:-1;">Hai Perso</h1>
            <h1 style="position: relative;
            top:70%;
            left:50%;
            opacity: ${vari};
            z-index:1;">Icaro</h1>    
            `}else{
            document.getElementById("perso").innerHTML=`<h1 style="position: relative;
            top:50%;
            left:50%;
            opacity: ${vari};
            z-index:-1;">Hai Perso</h1>`
            }
            if (vari==0){
            document.getElementById("tubo").innerHTML=""
            spot1=350;
            spot2=spot1+225;
            puntii=0;
            per=false}else{
                per=true
            }
            
        }
        function salta(){
            if (!per){
            altz=altz-30
            }
            else{
                per=false
                altz=100
                perso(0)
            }
        }
        
        function collisione(){/*non so minimamente come funzioni ho tirato numeri a caso per 10minuti*/
            let vri
            if ((spot1>spo && (spot1-30)<(spo))||(spot1<spo && (spot1+52)>spo)){
                vri=1
                if (altzt1<(altz+20)){
                    vri=10
                }
                if ((altzt1-80)>(altz-7)){
                    vri=10
                }
                
            }
            if ((spot2>spo&& (spot2-30)<(spo))||(spot2<spo && (spot2+52)>spo)){
                vri=1
                if (altzt2<(altz+20)){
                    vri=10
                }
                if ((altzt2-80)>(altz-7)){
                    vri=10
                }
            }
            return vri
        }
        setInterval(() => {
            if (!per && !debug){
                spot1=spot1-2
                spot2=spot2-2
                if (spot1<-52){
                    spot1=400
                    altzt1=120+Math.random() * 200;
                }
                 if (spot2<-52){
                    spot2=400
                    altzt2=120+Math.random() * 200;
                }
            }
            if (!per){
                if (altz<400){
                    altz=altz+2;
                }else{
                    if(!debug){
                    perso(1,0)
                    per=true;
                    }
                }if(altz<-30){
                    if(!debug){
                    perso(1,1);
                    per=true;
                }
                }
            }
            varvar=collisione()
            if (varvar==10){
                perso(1,0)
            }else{
                if (varvar==1){
                    puntii=puntii+1
                }
            }
            punti=puntii/26
            if (!debug){
            document.getElementById("uccello").innerHTML=`
                <img style="position: absolute;
                top:${altz}px;
                left:${spo}px;
                opacity: ${op};
                "src="uccello.png" alt="Flappy Bird">
                `;
            document.getElementById("tubo").innerHTML=`
                <img style="position: absolute;
                top:${altzt1}px;
                left:${spot1}px;
                opacity: 1;
                "src="tubo.png" alt="Flappy Bird">
                <img style="position: absolute;
                top:${altzt2}px;
                left:${spot2}px;
                opacity: 1;
                "src="tubo.png" alt="Flappy Bird">
                <img style="position: absolute;
                top:${altzt2-320-80}px;
                left:${spot2}px;
                opacity: 1;
                transform: rotate(180deg);
                "src="tubo.png" alt="Flappy Bird">
                <img style="position: absolute;
                top:${altzt1-320-80}px;
                left:${spot1}px;
                opacity: 1;
                transform: rotate(180deg);
                "src="tubo.png" alt="Flappy Bird">
                `;}
            document.getElementById("punti").innerHTML=`
            Punti: \n ${Math.round(punti)} 
            `
            document.getElementById("max").innerHTML=`
            Max: \n ${Math.round(max)} 
            `
            }, 30)
    </script>
</body>
</html>
